name: Build Windows with Linux bridge runtime

on:
  push:
    branches:
      - bambu-bridge
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Git ref or SHA to checkout for the build'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build_bridge:
    name: Build Windows with Linux bridge runtime
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build_windows_bridge_reusable.yml
    with:
      checkout_ref: ${{ github.event.inputs.checkout_ref || github.sha }}
      source_sha: ${{ github.sha }}
    secrets: inherit
